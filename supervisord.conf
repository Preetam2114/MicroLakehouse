[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10

[program:minio]
command=/opt/minio/minio server /data --console-address ":9001"
environment=MINIO_ROOT_USER="admin",MINIO_ROOT_PASSWORD="password"
autostart=true
autorestart=true
priority=20

[program:trino]
command=/opt/trino/bin/launcher run
autostart=true
autorestart=true
priority=30

[program:jupyter]
command=jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
directory=/workspace
autostart=true
autorestart=true
priority=40

[program:setup-script]
command=/opt/setup.sh
autostart=true
autorestart=false
startsecs=0
priority=50
